version: 2
updates:
  # Root package (client + server)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint refuses to load against TS 7 (typescript-eslint#10940).
      # A major TS bump therefore kills `npm run lint` outright, and because the
      # Lint & Type Check job runs lint BEFORE tsc, the type check silently stops
      # running too. This has landed twice via the dev-deps group and been
      # reverted twice (#69, and again here). Lift this only when
      # typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-deps:
        dependency-type: development
      firebase:
        patterns:
          - "firebase*"
          - "@firebase/*"

  # Cloud Functions
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint refuses to load against TS 7 (typescript-eslint#10940).
      # A major TS bump therefore kills `npm run lint` outright, and because the
      # Lint & Type Check job runs lint BEFORE tsc, the type check silently stops
      # running too. This has landed twice via the dev-deps group and been
      # reverted twice (#69, and again here). Lift this only when
      # typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
